name: Refresh profile activity

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rebuild activity cards
        run: python3 -B scripts/update_activity.py
      - name: Publish changed cards
        shell: bash
        run: |
          git add -- assets/activity/{wakatime,github,leetcode,codewars,euler,pypi}-{light,dark}.svg
          if git diff --cached --quiet; then
            echo "Cards are up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile activity cards'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
