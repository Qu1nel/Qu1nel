name: generate animation

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply profile palette and frame
        run: python3 -B scripts/frame_snake.py dist
      - name: Publish the daily animation
        shell: bash
        run: |
          git fetch --no-tags origin refs/heads/output
          target="$RUNNER_TEMP/profile-snake-output"
          git worktree add --detach "$target" FETCH_HEAD
          cp dist/github-contribution-grid-snake{,-dark}.svg "$target/"
          git -C "$target" add -- github-contribution-grid-snake{,-dark}.svg
          if git -C "$target" diff --cached --quiet; then
            echo "Snake images are up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$target" commit -m 'chore: refresh contribution snake'
          git -C "$target" push origin HEAD:refs/heads/output
